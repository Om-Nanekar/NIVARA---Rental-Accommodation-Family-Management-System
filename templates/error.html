{% extends 'base.html' %} 

{% block title %}{{ title }}{% endblock %} 

{% block content %}
<div class="d-flex align-items-center justify-content-center py-5">
  <div class="card-nivara text-center p-5" style="max-width: 480px; width: 100%;">
    <div class="empty-state-icon text-danger mb-3" style="background-color: var(--danger-bg);">
      <i class="bi bi-exclamation-triangle"></i>
    </div>
    <h1 class="page-title mb-2">{{ title }}</h1>
    <p class="text-secondary mb-4">{{ message }}</p>
    <div>
      <a class="btn btn-primary" href="{{ url_for('dashboard') }}">
        <i class="bi bi-arrow-left"></i>
        <span>Back to Dashboard</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}
