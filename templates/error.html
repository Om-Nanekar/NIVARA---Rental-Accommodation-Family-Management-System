{% extends 'base.html' %} 

{% block title %}{{ title }}{% endblock %} 

{% block content %}
<div class="card shadow-sm mx-auto my-5 text-center p-5" style="max-width: 540px; border-radius: 16px;">
  <div class="mb-3 text-danger">
    <i class="bi bi-exclamation-triangle-fill display-3"></i>
  </div>
  <h1 class="h3 fw-bold text-dark mb-2">{{ title }}</h1>
  <p class="text-secondary mb-4">{{ message }}</p>
  <div>
    <a class="btn btn-indigo px-4 py-2" href="{{ url_for('dashboard') }}">
      <i class="bi bi-house-door-fill me-1"></i> Back to Dashboard
    </a>
  </div>
</div>
{% endblock %}
