{% extends 'base.html' %}

{% block title %}Sign In{% endblock %}

{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-box">
    <div class="auth-brand">
      <h1 class="auth-title">NIVARA</h1>
      <p class="auth-subtitle">Rental Accommodation Management</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="alert-nivara alert-nivara-danger mb-3" role="alert">
          <i class="bi bi-exclamation-circle-fill"></i>
          <span class="flex-grow-1">{{ message }}</span>
        </div>
      {% endfor %}
    {% endwith %}

    <form method="post" autocomplete="off">
      <div class="form-group mb-3">
        <label class="form-label">Username</label>
        <input class="form-control" name="username" placeholder="Admin username" required autofocus />
      </div>

      <div class="form-group mb-4">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" name="password" placeholder="••••••••" required />
      </div>

      <button class="btn btn-primary w-100" type="submit">
        Sign in to Dashboard
      </button>
    </form>
  </div>
</div>
{% endblock %}
